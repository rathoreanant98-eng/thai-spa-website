name: Bootstrap website source

on:
  push:
    branches: [main]
    paths:
      - "_bootstrap/**"
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore website source
        shell: bash
        run: |
          set -euo pipefail
          cat _bootstrap/chunk*.b64 | base64 --decode > /tmp/site.tar.gz
          mkdir -p /tmp/site
          tar -xzf /tmp/site.tar.gz -C /tmp/site
          rsync -a --delete --exclude='.git/' /tmp/site/ ./

      - name: Commit website
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Build premium Thai spa website"
          git push origin main
